<!-- Tells the browser this document uses HTML5. -->
<!DOCTYPE html>

<!-- Sets the language of the page to English. -->
<html lang="en">

<head>
  <!-- Allows the browser to display special characters correctly. -->
  <meta charset="UTF-8">

  <!-- Makes the page use the device's screen width. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Provides a short description for search engines. -->
  <meta name="description" content="Explore the FASHION student website.">

  <!-- Sets the text displayed in the browser tab. -->
  <title>Home | FASHION</title>

  <!-- Loads the Poppins font in four different weights. -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700;900&amp;display=swap" rel="stylesheet">

  <!-- Connects this HTML page to the CSS stylesheet. -->
  <link rel="stylesheet" href="css/style.css">
</head>

<!-- The home class allows CSS to target this page specifically. -->
<body class="home">

  <!-- Lets keyboard users skip the header and go to the main content. -->
  <a class="skip-link" href="#main">Skip to main content</a>

  <!-- Contains the website logo, navigation and explore button. -->
  <header class="container header">

    <!-- Clicking the logo takes the user to the homepage. -->
    <a class="logo" href="index.html">
      <!-- Hides the decorative symbol from screen readers. -->
      <span aria-hidden="true">▰</span> FASHION
    </a>

    <!-- Groups the main links and labels them for screen readers. -->
    <nav aria-label="Main navigation">
      <!-- Identifies Home as the page currently being viewed. -->
      <a href="index.html" aria-current="page">Home</a>
      <a href="collections.html">Collections</a>
      <a href="about.html">About</a>
    </nav>

    <!-- A link styled as a button that opens the collections page. -->
    <a class="button" href="collections.html">Explore styles</a>
  </header>
  <main id="main">

    <!-- Introduces the website with a headline, button and model image. -->
    <section class="container hero">

      <!-- Groups the text on one side of the hero section. -->
      <div class="hero-text">

        <!-- The main heading. Each br starts a new line. -->
        <h1>
          <!-- These classes add a white background behind LET’S. -->
          <span class="highlight white">LET’S</span><br>
          EXPLORE<br>
          <!-- This class adds a yellow background behind UNIQUE. -->
          <span class="highlight">UNIQUE</span><br>
          CLOTHES.
        </h1>

        <!-- A short sentence describing the website's fashion style. -->
        <p>Live for Influential and Innovative fashion!</p>

        <!-- Takes the user to the collections page. -->
        <a class="button" href="collections.html">Shop Now</a>
      </div>

      <div class="hero-picture">
        <!--provides the default image.-->
        <img
          src="images/hero-600.webp"
          srcset="images/hero-300.webp 300w, images/hero-600.webp 600w"
          sizes="(max-width: 600px) 90vw, 45vw"
          alt="Woman wearing a fluffy pink coat and striped pink outfit"
        >
      </div>
    </section>
     <!-- Logos from the original mockup. -->
    <div class="brands">
      <div class="container brand-row">
        <img
          class="brand-logo"
          src="images/hm-600.webp"
          srcset="images/hm-300.webp 300w, images/hm-600.webp 600w"
          sizes="(max-width: 600px) 25vw, 120px"
          alt="H and M"
          loading="lazy"
        >

        <img
          class="brand-logo"
          src="images/obey-600.webp"
          srcset="images/obey-300.webp 300w, images/obey-600.webp 600w"
          sizes="(max-width: 600px) 25vw, 120px"
          alt="Obey"
          loading="lazy"
        >

        <img
          class="brand-logo"
          src="images/shopify-600.webp"
          srcset="images/shopify-300.webp 300w, images/shopify-600.webp 600w"
          sizes="(max-width: 600px) 25vw, 120px"
          alt="Shopify"
          loading="lazy"
        >

        <img
          class="brand-logo"
          src="images/lacoste-600.webp"
          srcset="images/lacoste-300.webp 300w, images/lacoste-600.webp 600w"
          sizes="(max-width: 600px) 25vw, 120px"
          alt="Lacoste"
          loading="lazy"
        >

        <img
          class="brand-logo"
          src="images/levis-600.webp"
          srcset="images/levis-300.webp 300w, images/levis-600.webp 600w"
          sizes="(max-width: 600px) 25vw, 120px"
          alt="Levi’s"
          loading="lazy"
        >

        <img
          class="brand-logo"
          src="images/amazon-600.webp"
          srcset="images/amazon-300.webp 300w, images/amazon-600.webp 600w"
          sizes="(max-width: 600px) 25vw, 120px"
          alt="Amazon"
          loading="lazy"
        >
      </div>
    </div>

  </main>
</body>
</html>
